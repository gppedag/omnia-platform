<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento CUP</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f7fb}.shell{max-width:620px;margin:6vh auto}.card{border:0;border-radius:24px;box-shadow:0 20px 55px rgba(15,23,42,.10)}.amount{font-size:2.5rem;font-weight:700}.brand{font-weight:700;color:#0d6efd}</style></head><body><main class="shell px-3"><div class="card p-4 p-md-5"><div class="brand mb-4">CUP System</div><div id="box"><div class="text-muted">Caricamento richiesta...</div></div></div></main><script src="config.js"></script><script>
const token=new URLSearchParams(location.search).get('token')||'';const box=document.getElementById('box');
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
(async()=>{try{const r=await fetch((window.CUP_CONFIG.API_BASE_URL||'/api')+'/payments/public/'+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw new Error(d.detail||'Richiesta non disponibile');const paid=d.status==='paid';box.innerHTML=`<div class="small text-uppercase text-muted mb-2">${esc(d.patient_name||'Paziente')}</div><h2>${esc(d.description)}</h2><div class="amount my-4">${Number(d.amount).toLocaleString('it-IT',{style:'currency',currency:d.currency||'EUR'})}</div>${paid?'<div class="alert alert-success">Pagamento ricevuto. Grazie.</div>':d.checkout_url?`<p class="text-muted">Il pagamento viene effettuato sul provider sicuro configurato dall'esercizio. Il CUP non acquisisce i dati della carta.</p><a class="btn btn-primary btn-lg w-100" href="${esc(d.checkout_url)}">Procedi al pagamento</a>`:'<div class="alert alert-info">La richiesta è registrata. Per questa struttura il pagamento viene gestito con modalità manuale; contatta la segreteria per le istruzioni.</div>'}<div class="small text-muted mt-4">Stato: ${esc(d.status)}</div>`;}catch(e){box.innerHTML=`<div class="alert alert-danger">${esc(e.message)}</div>`}})();
</script></body></html>
