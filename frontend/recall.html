<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Richiamo periodico</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="config.js"></script></head><body class="patient-flow-bg"><main class="container py-5" style="max-width:720px"><div class="card patient-action-card shadow-sm"><div class="card-body p-4 p-md-5"><div class="eyebrow">RICHIAMO PERIODICO</div><h2>È il momento del tuo controllo</h2><p class="text-muted" id="summary">Caricamento...</p><a class="btn btn-primary btn-lg w-100 d-none" id="action">Prenota il controllo</a><div class="small text-muted mt-3">Se hai già prenotato, non devi fare nulla: il sistema riconoscerà automaticamente il nuovo appuntamento.</div><div class="alert alert-danger d-none mt-3" id="error"></div></div></div></main><script>const token=new URLSearchParams(location.search).get('token');const api=window.CUP_CONFIG.API_BASE_URL;async function init(){try{const r=await fetch(api+'/care/public/recall/'+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw new Error(d.detail||'Link non valido');document.getElementById('summary').textContent=`${d.service_name}. Richiamo previsto dal ${new Date(d.due_at).toLocaleDateString('it-IT')}.`;const a=document.getElementById('action');a.href=d.action_url;a.classList.remove('d-none')}catch(e){const el=document.getElementById('error');el.textContent=e.message;el.classList.remove('d-none')}}init();</script></body></html>
