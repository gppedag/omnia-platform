<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Follow-up visita</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="config.js"></script></head><body class="patient-flow-bg"><main class="container py-5" style="max-width:720px"><div class="card patient-action-card shadow-sm"><div class="card-body p-4 p-md-5"><div class="eyebrow">DOPO LA VISITA</div><h2 class="mb-2">Come stai?</h2><p class="text-muted" id="summary">Caricamento...</p><form id="form" class="d-none"><label class="form-label fw-semibold">Valutazione esperienza</label><div class="d-flex gap-2 mb-4" id="rating"></div><label class="form-label fw-semibold">Come ti senti rispetto a prima?</label><select class="form-select mb-3" id="wellbeing"><option value="better">Meglio</option><option value="same">Uguale</option><option value="worse">Peggio</option></select><div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="contact"><label class="form-check-label" for="contact">Vorrei essere ricontattato da un operatore</label></div><label class="form-label">Note (facoltative)</label><textarea class="form-control mb-4" id="comment" rows="4"></textarea><button class="btn btn-primary w-100" type="submit">Invia risposta</button></form><div class="alert d-none mt-3" id="result"></div></div></div></main><script>const token=new URLSearchParams(location.search).get('token');const api=window.CUP_CONFIG.API_BASE_URL;let score=5;const form=document.getElementById('form'),summary=document.getElementById('summary'),result=document.getElementById('result');async function init(){try{const r=await fetch(api+'/care/public/followup/'+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw new Error(d.detail||'Link non valido');summary.textContent=`${d.service_name||'Visita'} · ${new Date(d.date).toLocaleDateString('it-IT')}`;form.classList.remove('d-none');document.getElementById('rating').innerHTML=[1,2,3,4,5].map(x=>`<button type="button" class="btn ${x===5?'btn-primary':'btn-outline-primary'}" data-score="${x}">${x}</button>`).join('');document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{score=+b.dataset.score;document.querySelectorAll('[data-score]').forEach(x=>x.className='btn '+(+x.dataset.score===score?'btn-primary':'btn-outline-primary'))})}catch(e){summary.textContent=e.message}}form.onsubmit=async e=>{e.preventDefault();const r=await fetch(api+'/care/public/followup/'+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rating:score,wellbeing:document.getElementById('wellbeing').value,needs_contact:document.getElementById('contact').checked,comment:document.getElementById('comment').value||null})});const d=await r.json();result.className='alert mt-3 '+(r.ok?'alert-success':'alert-danger');result.textContent=r.ok?'Grazie. La tua risposta è stata registrata.':(d.detail||'Errore');result.classList.remove('d-none');if(r.ok)form.classList.add('d-none')};init();</script></body></html>
