<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check-in CUP</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><style>body{background:#f3f7fb}.wrap{max-width:620px;margin:8vh auto}.card{border:0;border-radius:22px}.hero{font-size:3.4rem}</style></head><body><main class="wrap px-3"><div class="card shadow-sm"><div class="card-body p-4 p-md-5 text-center"><div class="hero text-primary"><i class="bi bi-geo-alt-fill"></i></div><h2>Check-in appuntamento</h2><div id="loading" class="text-muted mt-4"><span class="spinner-border spinner-border-sm me-2"></span>Caricamento...</div><div id="content" class="d-none"><div class="border rounded-4 p-3 text-start my-4"><strong id="service"></strong><div class="mt-2"><i class="bi bi-person me-2"></i><span id="patient"></span></div><div><i class="bi bi-calendar3 me-2"></i><span id="when"></span></div></div><div id="status" class="alert alert-info"></div><button id="checkin" class="btn btn-success btn-lg w-100"><i class="bi bi-check2-square me-2"></i>Sono arrivato</button></div><div id="error" class="alert alert-danger d-none mt-4"></div></div></div></main><script>
const token=new URLSearchParams(location.search).get('token')||'',api='/api/previsit/checkin';async function load(){try{const r=await fetch(`${api}/public?token=${encodeURIComponent(token)}`);if(!r.ok)throw new Error((await r.json()).detail||'Link non valido');const d=await r.json();document.getElementById('service').textContent=d.service_name;document.getElementById('patient').textContent=d.patient_name||'';document.getElementById('when').textContent=new Date(d.scheduled_at).toLocaleString('it-IT');document.getElementById('status').textContent=d.status==='checked_in'?'Check-in già registrato.':'Quando sei arrivato in struttura, premi il pulsante qui sotto.';if(d.status==='checked_in')document.getElementById('checkin').classList.add('d-none');document.getElementById('loading').classList.add('d-none');document.getElementById('content').classList.remove('d-none')}catch(e){document.getElementById('loading').classList.add('d-none');const x=document.getElementById('error');x.textContent=e.message;x.classList.remove('d-none')}}document.getElementById('checkin').onclick=async()=>{try{const r=await fetch(`${api}/public`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});if(!r.ok)throw new Error((await r.json()).detail||'Check-in non riuscito');document.getElementById('status').className='alert alert-success';document.getElementById('status').textContent='Check-in registrato. Puoi accomodarti in sala d’attesa.';document.getElementById('checkin').classList.add('d-none')}catch(e){alert(e.message)}};load();
</script></body></html>
