<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pre-visita CUP</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><style>body{background:linear-gradient(135deg,#eef4ff,#f8fbff);min-height:100vh}.wrap{max-width:760px;margin:4vh auto}.step{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#0d6efd;color:#fff;font-weight:700}.card{border:0;border-radius:20px}.consent{background:#f6f8fb}</style></head><body><main class="wrap px-3"><div class="card shadow-sm"><div class="card-body p-4 p-md-5"><div class="d-flex align-items-center gap-3 mb-4"><span class="step">1</span><div><div class="text-primary fw-semibold">PRE-VISITA DIGITALE</div><h2 class="mb-0" id="title">Prepariamo il tuo appuntamento</h2></div></div><div id="loading" class="text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Caricamento...</div><div id="error" class="alert alert-danger d-none"></div><form id="form" class="d-none"><div class="alert alert-primary"><strong id="service"></strong><div id="when" class="small mt-1"></div></div><div id="fields" class="row g-3"></div><div class="consent border rounded-4 p-3 mt-4"><h5 id="consent-title"></h5><p class="small text-muted" id="consent-text"></p><div class="form-check"><input class="form-check-input" type="checkbox" id="consent" required><label class="form-check-label" for="consent">Ho letto e accetto</label></div><div class="mt-3"><label class="form-label">Nome e cognome per conferma</label><input class="form-control" id="consent-name" required></div></div><button class="btn btn-primary btn-lg w-100 mt-4" type="submit"><i class="bi bi-check2-circle me-2"></i>Completa pre-visita</button></form><div id="done" class="d-none text-center py-5"><div class="display-4 text-success"><i class="bi bi-check-circle"></i></div><h3 class="mt-3">Pre-visita completata</h3><p class="text-muted">Le informazioni sono state associate al tuo appuntamento.</p></div></div></div></main><script>
const token=new URLSearchParams(location.search).get('token')||'', api='/api/previsit';let data=null;const esc=s=>String(s||'');
async function load(){try{const r=await fetch(`${api}/public?token=${encodeURIComponent(token)}`);if(!r.ok)throw new Error((await r.json()).detail||'Link non valido');data=await r.json();document.getElementById('loading').classList.add('d-none');if(data.status==='completed'){document.getElementById('done').classList.remove('d-none');return}document.getElementById('service').textContent=data.service_name;document.getElementById('when').textContent=new Date(data.scheduled_at).toLocaleString('it-IT');document.getElementById('consent-title').textContent=data.consent_title;document.getElementById('consent-text').textContent=data.consent_text;const box=document.getElementById('fields');(data.fields||[]).forEach((f,i)=>{const d=document.createElement('div');d.className='col-12';const req=f.required?'required':'';const star=f.required?' *':'';d.innerHTML=f.type==='textarea'?`<label class="form-label">${esc(f.label)}${star}</label><textarea class="form-control" rows="3" data-key="${esc(f.key)}" ${req}></textarea>`:`<label class="form-label">${esc(f.label)}${star}</label><input class="form-control" data-key="${esc(f.key)}" ${req}>`;box.appendChild(d)});document.getElementById('form').classList.remove('d-none')}catch(e){document.getElementById('loading').classList.add('d-none');const x=document.getElementById('error');x.textContent=e.message;x.classList.remove('d-none')}}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const answers={};document.querySelectorAll('[data-key]').forEach(x=>answers[x.dataset.key]=x.value);const body={token,answers,consent_accepted:document.getElementById('consent').checked,consent_name:document.getElementById('consent-name').value.trim()};try{const r=await fetch(`${api}/public/submit`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error((await r.json()).detail||'Invio non riuscito');document.getElementById('form').classList.add('d-none');document.getElementById('done').classList.remove('d-none')}catch(e){alert(e.message)}});load();
</script></body></html>
