<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Firma documento CUP</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f7fb}.shell{max-width:980px;margin:3vh auto}.card{border:0;border-radius:22px;box-shadow:0 18px 50px rgba(15,23,42,.10)}iframe{width:100%;height:62vh;border:1px solid #dee2e6;border-radius:14px;background:#fff}.sig{width:100%;height:180px;border:2px dashed #adb5bd;border-radius:14px;touch-action:none;background:white}.brand{font-weight:700;color:#0d6efd}</style></head><body><main class="shell px-3"><div class="card p-3 p-md-4"><div class="brand mb-3">CUP System · Firma documento</div><div id="loading" class="text-muted">Caricamento...</div><div id="content" class="d-none"><div class="row g-4"><div class="col-lg-7"><h3 id="title"></h3><p class="text-muted" id="message"></p><iframe id="document-frame" title="Documento da firmare"></iframe><div class="small text-muted mt-2">Impronta documento: <code id="hash"></code></div></div><div class="col-lg-5"><div id="status-box"></div><form id="sign-form"><label class="form-label">Nome e cognome</label><input id="name" class="form-control mb-3" required><label class="form-label">Firma</label><canvas id="canvas" class="sig"></canvas><div class="d-flex justify-content-between mt-2"><span class="small text-muted">Firma con dito, mouse o penna.</span><button type="button" class="btn btn-sm btn-outline-secondary" id="clear">Cancella</button></div><div class="form-check mt-3"><input class="form-check-input" id="accepted" type="checkbox" required><label class="form-check-label" for="accepted">Dichiaro di aver letto il documento e di accettarne il contenuto.</label></div><button class="btn btn-primary btn-lg w-100 mt-3" type="submit">Firma documento</button><button class="btn btn-link text-danger w-100 mt-2" type="button" id="decline">Non accetto</button></form><div id="result" class="mt-3"></div></div></div></div></div></main><script src="config.js"></script><script>
const api=window.CUP_CONFIG.API_BASE_URL||'/api',token=new URLSearchParams(location.search).get('token')||'',loading=document.getElementById('loading'),content=document.getElementById('content'),form=document.getElementById('sign-form'),result=document.getElementById('result');let info=null,drawn=false;
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.scale(d,d);ctx.lineWidth=2.2;ctx.lineCap='round';}window.addEventListener('resize',resize);function pos(e){const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return [p.clientX-r.left,p.clientY-r.top]}let active=false;function start(e){active=true;drawn=true;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault()}function move(e){if(!active)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();e.preventDefault()}function end(){active=false}['mousedown','touchstart'].forEach(x=>canvas.addEventListener(x,start,{passive:false}));['mousemove','touchmove'].forEach(x=>canvas.addEventListener(x,move,{passive:false}));['mouseup','mouseleave','touchend'].forEach(x=>canvas.addEventListener(x,end));document.getElementById('clear').onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);drawn=false};
(async()=>{try{const r=await fetch(api+'/signatures/public/'+encodeURIComponent(token));info=await r.json();if(!r.ok)throw new Error(info.detail||'Documento non disponibile');loading.classList.add('d-none');content.classList.remove('d-none');document.getElementById('title').textContent=info.title;document.getElementById('message').textContent=info.message||'';document.getElementById('hash').textContent=info.document_sha256;document.getElementById('document-frame').src=info.document_url;document.getElementById('name').value=info.patient_name||'';resize();if(info.status==='signed'){form.classList.add('d-none');document.getElementById('status-box').innerHTML='<div class="alert alert-success">Documento già firmato.</div>'}else if(['declined','expired'].includes(info.status)){form.classList.add('d-none');document.getElementById('status-box').innerHTML='<div class="alert alert-warning">Questa richiesta non è più firmabile.</div>'}}catch(e){loading.innerHTML='<div class="alert alert-danger">'+esc(e.message)+'</div>'}})();
form.addEventListener('submit',async e=>{e.preventDefault();if(!drawn){result.innerHTML='<div class="alert alert-warning">Inserisci la firma grafica.</div>';return}try{const r=await fetch(api+'/signatures/public/'+encodeURIComponent(token)+'/sign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({signer_name:document.getElementById('name').value.trim(),accepted:document.getElementById('accepted').checked,signature_data:canvas.toDataURL('image/png')})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Firma non riuscita');form.classList.add('d-none');result.innerHTML='<div class="alert alert-success">Documento firmato correttamente. Puoi chiudere questa pagina.</div>'}catch(err){result.innerHTML='<div class="alert alert-danger">'+esc(err.message)+'</div>'}});
document.getElementById('decline').onclick=async()=>{if(!confirm('Confermi di non accettare il documento?'))return;const reason=prompt('Motivo facoltativo')||'';try{const r=await fetch(api+'/signatures/public/'+encodeURIComponent(token)+'/decline',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Operazione non riuscita');form.classList.add('d-none');result.innerHTML='<div class="alert alert-warning">Documento rifiutato. La segreteria verrà informata.</div>'}catch(err){result.innerHTML='<div class="alert alert-danger">'+esc(err.message)+'</div>'}};
</script></body></html>
