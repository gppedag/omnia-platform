<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proposta appuntamento</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:720px"><div class="card shadow-sm"><div class="card-body p-4"><div class="text-primary fw-bold small mb-2">LISTA D'ATTESA CUP</div><h2>Si è liberato un appuntamento</h2><div id="content" class="mt-4"><div class="text-muted">Caricamento...</div></div></div></div></main><script>
const api='/api'; const token=new URLSearchParams(location.search).get('token');
async function load(){const el=document.getElementById('content'); if(!token){el.innerHTML='<div class="alert alert-danger">Link non valido.</div>';return;} try{const r=await fetch(api+'/waitlist/public/offer?token='+encodeURIComponent(token)); const d=await r.json(); if(!r.ok)throw new Error(d.detail||'Errore'); const dt=new Date(d.scheduled_at); const active=d.offer_status==='open'&&d.status==='offered'; el.innerHTML=`<div class="p-3 bg-light rounded mb-3"><div class="fw-bold fs-5">${d.visit}</div><div>${dt.toLocaleDateString('it-IT',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})} alle ${dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</div><div class="text-muted">${d.agenda||''}</div></div>${active?'<p>Lo slot viene assegnato al primo paziente che conferma.</p><button class="btn btn-primary btn-lg" id="accept">Accetta appuntamento</button>':'<div class="alert alert-secondary">Questa proposta non è più disponibile.</div>'}`; document.getElementById('accept')?.addEventListener('click',accept);}catch(e){el.innerHTML='<div class="alert alert-danger">'+e.message+'</div>';}}
async function accept(){const b=document.getElementById('accept');b.disabled=true;try{const r=await fetch(api+'/waitlist/public/accept?token='+encodeURIComponent(token),{method:'POST'});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Non disponibile');document.getElementById('content').innerHTML='<div class="alert alert-success"><strong>Appuntamento confermato.</strong><br>Riceverai i promemoria secondo le preferenze registrate.</div>';}catch(e){document.getElementById('content').innerHTML='<div class="alert alert-warning">'+e.message+'</div>';}} load();
</script></body></html>
