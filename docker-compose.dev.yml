services:
  postgres:
    image: postgres:14
    container_name: omnia-dev-postgres
    restart: unless-stopped
    env_file:
      - .env.dev
    volumes:
      - omnia_dev_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnia_dev -d omnia_dev"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - omnia-dev-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnia-dev-backend
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      DATABASE_URL: postgresql://omnia_dev:${POSTGRES_PASSWORD}@postgres:5432/omnia_dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro
      - omnia_dev_uploads:/data/uploads
    ports:
      - "8201:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - omnia-dev-network

  frontend:
    image: nginx:alpine
    container_name: omnia-dev-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8200:80"
    networks:
      - omnia-dev-network

networks:
  omnia-dev-network:
    name: omnia-dev-network
    driver: bridge

volumes:
  omnia_dev_pg_data:
    name: omnia-dev-pg-data-v2
  omnia_dev_uploads:
    name: omnia-dev-uploads
